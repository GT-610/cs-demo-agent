[package]
name = "csgoproto"
version = "0.1.5"
authors = ["Laiho"]
edition = "2021"
license = "MIT"
repository = "https://github.com/LaihoE/demoparser"

[lib]
crate-type = ["lib"]

[dependencies]
prost = "0.13.3"
phf = { version = "0.11", features = ["macros"] }
strum = { version = "0.26", features = ["derive"] }
winnow = { version = "0.7.2", features = ["simd"] }
