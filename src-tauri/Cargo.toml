[package]
name = "cs-demo-agent"
version = "0.1.0"
description = "Local-first AI analysis workspace for Counter-Strike demos"
authors = ["CS Demo Agent contributors"]
edition = "2021"

[lib]
name = "cs_demo_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
